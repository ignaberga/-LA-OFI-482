<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Ofi 482</title>
<style>
  :root { --bg: #F3EFEA; --surface: #FFFFFF; --line: #E0D8CF; --ink: #2B2024; --soft: #6E6166; --accent: #57202D; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 24px; color: var(--accent); margin: 0 0 6px; }
  p { color: var(--soft); font-size: 14px; margin: 0 0 20px; }
  a { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; color: var(--ink); text-decoration: none; font-weight: 700; margin-bottom: 10px; }
  a span { display: block; font-weight: 400; font-size: 13px; color: var(--soft); margin-top: 3px; }
</style>
</head>
<body>
<main>
  <h1>La Ofi 482</h1>
  <p>Apps de la oficina. Cada una se instala con su propio link.</p>
  <a href="stockbares/">Stock de bares<span>Compras, conteos, ventas y control de faltantes</span></a>
</main>
</body>
</html>
